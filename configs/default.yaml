# =============================================================================
# CyberDreamer — default.yaml
# Master configuration file
# Current dataset target: CTU-13
# =============================================================================

project:
  name: "cyberdream"
  seed: 42
  device: "cpu"
  run_name: "ctu13_run_001"
  experiments_dir: "experiments/${project.run_name}"


# -----------------------------------------------------------------------------
# Stages 1-2 (WS1/WS2): Feature Pipeline + Graph Builder
# -----------------------------------------------------------------------------

feature_pipeline:

  # Sliding time-window configuration.
  # A record at elapsed time e belongs to every window k where:
  #   k*stride <= e < k*stride + window_size
  # window_size == stride gives non-overlapping windows; window_size > stride
  # gives overlapping sliding windows (each record appears in multiple windows).
  window_size: 60
  stride: 10

  # Datasets to load. Each entry needs a unique `name` and its raw_path.
  # Add another entry here (e.g. CIC-IDS-2018) to fuse multiple datasets.
  datasets:
    - name: "CTU-13"
      raw_path: "data/raw/CTU-13/"

  # Feature-fusion output
  processed_output_path: "data/processed/"

  # CTU-13 currently provides network-flow data
  event_sources:
    - "netflow"

  # Numeric feature normalization
  normalization:
    method: "z_score"
    per_feature_stats_path: "data/processed/feature_stats.json"

  # Columns that must NEVER be z-score normalized, even though they are
  # numeric-typed — they're categorical/ID-like (ports, protocol numbers,
  # connection-state codes) and normalizing them would corrupt the features
  # the graph builder and GNN encoder rely on. This list is *added to* the
  # engine's built-in defaults (which already cover common CIC-IDS-2018 /
  # CTU-13 column names) — only list dataset-specific extras here.
  exclude_from_normalization: []

  # Column holding the ground-truth label. Always excluded from numeric
  # conversion and normalization, kept as-is through the whole pipeline.
  label_column: "Label"

  # Missing-value handling. One of: forward_fill | zero_fill | mean_fill
  missing_value_strategy: "forward_fill"

  # Reserved for future categorical processing
  categorical_encoding: "embedding"


# -----------------------------------------------------------------------------
# Stage 2: Graph Builder
# -----------------------------------------------------------------------------

graph_builder:

  node_types:
    - "host"
    - "user"
    - "process"
    - "domain"

  edge_types:
    - "connects_to"
    - "authenticates_as"
    - "spawns"
    - "resolves"

  max_nodes_per_snapshot: 5000
  max_edges_per_snapshot: 20000

  snapshot_interval_sec: 60

  graph_cache_path: "data/graphs/"

  node_feature_dim: 32
  edge_feature_dim: 8


# -----------------------------------------------------------------------------
# Stage 3-4: GNN Encoder + RSSM World Model
# -----------------------------------------------------------------------------

spatial_encoder:

  architecture: "gat"

  num_layers: 3

  hidden_dim: 128

  output_embedding_dim: 256

  num_attention_heads: 4

  dropout: 0.1

  aggregation: "mean"

  use_layer_norm: true


world_model:

  deterministic_state_dim: 256

  stochastic_state_dim: 32

  num_stochastic_categories: 32

  hidden_dim: 256

  min_std: 0.1

  kl_balance_alpha: 0.8

  free_nats: 1.0


# -----------------------------------------------------------------------------
# Stage 5: Prediction Heads
# -----------------------------------------------------------------------------

prediction_heads:

  risk_score_head:
    hidden_dim: 64
    output_range:
      - 0.0
      - 1.0

  mitre_stage_classifier_head:
    hidden_dim: 128
    num_classes: 7


# -----------------------------------------------------------------------------
# Stage 6: Imagination Rollout & Counterfactuals
# -----------------------------------------------------------------------------

imagination_rollout:

  k_rollout_steps: 15

  num_rollout_trajectories: 32

  rollout_policy: "learned"

  discount_gamma: 0.99

  lambda_return: 0.95

  counterfactual:
    enabled: true
    max_interventions_per_query: 3


# -----------------------------------------------------------------------------
# Stage 7: Explainability
# -----------------------------------------------------------------------------

explainability:

  attention:
    top_k_contributing_nodes: 10
    top_k_contributing_edges: 15

  shap:
    background_sample_size: 100
    explainer_type: "gradient"

  trajectory_viz:
    method: "umap"
    n_components: 2

  explanation_output_path: "experiments/${project.run_name}/explanations/"


# -----------------------------------------------------------------------------
# Stage 8: Evaluation & Benchmarking
# -----------------------------------------------------------------------------

evaluation:

  metrics:
    - "precision_at_k"
    - "recall_at_k"
    - "f1_score"
    - "rollout_calibration_error"

  test_split_path: "data/processed/test_split.json"

  num_eval_rollouts: 100

  baselines:
    - "logistic_regression"
    - "lstm_only"

  results_output_path: "experiments/${project.run_name}/ablation_results.csv"


# -----------------------------------------------------------------------------
# Demo UI
# -----------------------------------------------------------------------------

demo_ui:

  host: "0.0.0.0"

  port: 8501

  refresh_interval_sec: 5

  max_graph_nodes_rendered: 500

  theme: "dark"


# -----------------------------------------------------------------------------
# Training
# -----------------------------------------------------------------------------

training:

  batch_size: 64

  sequence_length: 50

  num_epochs: 100

  learning_rate: 3.0e-4

  optimizer: "adamw"

  weight_decay: 1.0e-6

  grad_clip_norm: 100.0

  lr_scheduler: "cosine"

  warmup_steps: 1000

  checkpoint_every_n_steps: 500

  eval_every_n_steps: 250

  early_stopping_patience: 10

  mixed_precision: false

  checkpoint_dir: "experiments/${project.run_name}/checkpoints/"


# -----------------------------------------------------------------------------
# Data Splits
# -----------------------------------------------------------------------------

data:

  train_split_ratio: 0.7

  val_split_ratio: 0.15

  test_split_ratio: 0.15

  split_seed: 42
